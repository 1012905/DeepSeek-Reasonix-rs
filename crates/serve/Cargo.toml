[package]
name = "reasonix-serve"
description = "HTTP/SSE loopback frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reasonix-config = { workspace = true }
reasonix-contract = { workspace = true }
# The sink pipeline's diff recognizer (Go internal/base/diff).
reasonix-core = { workspace = true }
# The emit-pipeline bridge onto the agent loop's sink trait (agent spine
# integration note: serve may depend on the agent crate, never the reverse).
reasonix-agent = { workspace = true }
# [secrets] arms the read-tool denylists at boot (Go build.go:230).
reasonix-tools = { workspace = true }
reasonix-session = { workspace = true }
axum = { workspace = true }
bcrypt = { workspace = true }
bytes = { workspace = true }
getrandom = { workspace = true }
# Session-cookie signature and the PBKDF2 session-key derivation (auth.go).
hmac = { workspace = true }
sha2 = { workspace = true }
# Listen shape (hyper-util is already in the graph through axum): the frozen
# binding contract needs ReadHeaderTimeout, which axum::serve does not expose.
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "service", "http1", "http2"] }
serde = { workspace = true }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
# OPT-003: the catch-panic layer is a tower Layer, which axum's Router takes.
# Traits only; the util features join through the dev-dependency below.
tower = "0.5"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
# The pipeline-adapter tests drive a real turn over the canned provider.
reasonix-provider = { workspace = true }
reasonix-state = { workspace = true }
ruzstd = { workspace = true }
# start_paused drives the coalesce window deterministically in tests.
tokio = { version = "1", features = ["test-util"] }
# Test-only: drives routers to responses (tower::ServiceExt::oneshot).
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "gate"
harness = false

[[bench]]
name = "emit"
harness = false

[[bench]]
name = "frames"
harness = false
