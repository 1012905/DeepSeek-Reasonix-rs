[package]
name = "reasonix-agent"
description = "Agent loop: turns, approvals, budget, cancellation, delegation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reasonix-contract = { workspace = true }
reasonix-provider = { workspace = true }
# The approval gate composes the safety permission gate instead of
# re-deriving its verdict matrix (Go: control wraps permission.Gate).
reasonix-safety = { workspace = true }
reasonix-state = { workspace = true }
reasonix-tools = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
