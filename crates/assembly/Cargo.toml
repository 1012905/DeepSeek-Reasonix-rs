[package]
name = "reasonix-assembly"
description = "Composition root wiring the kernel into runnable binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
# The emit chain hands the turn machine its side of the composed pipeline.
reasonix-agent.workspace = true
reasonix-cli.workspace = true
reasonix-serve.workspace = true
reasonix-session.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
# start_paused drives the coalesce window deterministically in tests.
tokio = { version = "1", features = ["test-util"] }
