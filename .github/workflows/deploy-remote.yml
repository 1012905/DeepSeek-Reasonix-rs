name: Deploy remote worker

on:
  workflow_dispatch:
  push:
    branches: [studio]
    paths:
      - "workers/remote/**"
      - "desktop-tauri/**"
      - ".github/workflows/deploy-remote.yml"

permissions:
  contents: read

concurrency:
  group: remote-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop-tauri/pnpm-lock.yaml
      - name: Build the web shell
        working-directory: desktop-tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install worker dependencies
        working-directory: workers/remote
        run: npm ci --no-audit --no-fund
      - name: Deploy
        working-directory: workers/remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
