name: CI

# studio is a parallel release line, not a feature branch: it carries the
# kernel changes Studio is built on, so it needs the same kernel gates main-v2
# has. Studio's own surface (desktop/next, desktop/frontend-next) exists only
# there and is covered by studio.yml.
on:
  push:
    branches: [main-v2, studio]
  pull_request:
    branches: [main-v2, studio]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/studio' }}

jobs:
  # Cheap path gate for pull requests. PRs confined to docs/release-notes
  # (or top-level Markdown) skip the heavy Go jobs, and PRs that cannot affect
  # the desktop module skip the desktop jobs. Job-level `if` reports skipped,
  # which satisfies the required status checks (lint, race, test) — a
  # workflow-level paths-ignore would leave required checks pending and block
  # merges. Gated jobs skip only on an explicit `false` output: wrapped in
  # `always()`, a failed `changes` job (or a missing output) makes them run
  # the full matrix instead of silently passing required checks as skipped.
  # Pushes to main-v2 always run everything. Pull requests run the macOS and
  # Windows legs only when `platform` is not 'false'; the rule lives in
  # scripts/ci-platform-scope.sh and fails toward running them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      desktop: ${{ steps.filter.outputs.desktop }}
      sdk: ${{ steps.filter.outputs.sdk }}
      scripts: ${{ steps.filter.outputs.scripts }}
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          code=true; desktop=true; sdk=true; scripts=true; platform=true
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --no-renames "$base" HEAD)
            if [ -n "$files" ]; then
              code=false; desktop=false; sdk=false; scripts=false
              # Root-module CI: desktop/ is a separate module, so only the
              # clearly unrelated paths below can skip it.
              if echo "$files" | grep -qvE '^(docs/|release-notes/|desktop/|desktop-tauri/|workers/|[^/]+\.md$)'; then code=true; fi
              # desktop/ imports the root kernel via `replace reasonix => ../`,
              # so only this clearly-unrelated set is safe to skip. desktop-tauri/
              # holds no Go code; its gates run in studio-tauri.yml.
              if echo "$files" | grep -qvE '^(docs/|release-notes/|desktop/|desktop-tauri/|workers/|benchmarks/|npm/|[^/]+\.md$)'; then desktop=true; fi
              # sdk/go is a nested module invisible to root `go test ./...`;
              # its DTOs are generated from internal/ext/extension/protocol, so
              # both paths must trigger the sdk job.
              if echo "$files" | grep -qE '^(sdk/|internal/ext/extension/)'; then sdk=true; fi
              # The release-note tests render every committed Studio note; npm/ holds the publish tests.
              if echo "$files" | grep -qE '^(scripts/|npm/|release-notes/studio/|\.github/workflows/release-studio\.yml$)'; then scripts=true; fi
              platform=$(git diff -z --name-only --no-renames "$base" HEAD | bash scripts/ci-platform-scope.sh)
            fi
          fi
          { echo "code=$code"; echo "desktop=$desktop"; echo "sdk=$sdk"; echo "scripts=$scripts"; echo "platform=$platform"; } >> "$GITHUB_OUTPUT"

  release-notes-scripts:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.scripts != 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: node --test scripts/linux-install-smoke.test.mjs scripts/studio-artifacts.test.mjs scripts/ci-platform-scope.test.mjs scripts/ci-automation.test.mjs scripts/cli-archive-build.test.mjs scripts/cli-archive-contents.test.mjs scripts/release-credits.test.mjs scripts/update-contributors.test.mjs scripts/update-acknowledgments.test.mjs scripts/markdown-refs.test.mjs scripts/studio-release-notes.test.mjs scripts/publish-cli-pointer.test.mjs scripts/studio-release-flags.test.mjs scripts/studio-notes-publish.test.mjs scripts/withdraw-version.test.mjs scripts/brew-cask-guard.test.mjs scripts/feedback-sync.test.mjs npm/publish.test.mjs

  # The ruleset requires the per-OS check names (test (ubuntu-latest) etc.).
  # A matrix job skipped at job level reports no per-leg checks at all, so
  # those required checks would stay "Expected" and block merging. The job
  # therefore always runs and the steps do the gating: when the changes
  # detector reports the diff is unrelated, every step skips and each leg
  # reports success in seconds. `always()` also keeps the legs alive when
  # the changes job itself fails (fail-open: an empty output != 'false').
  # A pull request with no platform-relevant change moves the macOS and
  # Windows legs onto an ubuntu runner with every step skipped: the check
  # names the ruleset requires still report, without a scarce runner.
  test:
    needs: changes
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ github.event_name == 'pull_request' && needs.changes.outputs.platform == 'false' && 'ubuntu-latest' || matrix.os }}
    env:
      RUN_STEPS: ${{ github.event_name != 'pull_request' || (needs.changes.outputs.code != 'false' && (matrix.os == 'ubuntu-latest' || needs.changes.outputs.platform != 'false')) }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and verify Linux sandbox backend
        if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true || \
            echo "::warning::bubblewrap is installed but this runner denies user namespaces; unavailable-backend tests will run fail-closed"

      # Skipped on Windows: the runner checks out CRLF, so gofmt -l flags every
      # file. gofmt output is OS-independent, so the Unix legs already cover it.
      - name: gofmt
        if: env.RUN_STEPS == 'true' && runner.os != 'Windows'
        run: |
          # Root module only — desktop/ is a separate module with its own tooling.
          unformatted=$(gofmt -l . | grep -v '^desktop/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        if: env.RUN_STEPS == 'true'
        run: go vet ./...

      - name: build
        if: env.RUN_STEPS == 'true'
        run: go build ./...

      # The trajectory analyzer is the last consumer of the todo_progress frame,
      # so a rename anywhere upstream has to fail somewhere. Standard library
      # only; the runner's python3 is enough.
      - name: test (trajectory tools)
        if: env.RUN_STEPS == 'true' && runner.os != 'Windows'
        run: python3 -m unittest discover -s tools/trajectory -t tools/trajectory

      # A hardware exception on a Windows host whose CPU saves a large XSTATE
      # (Intel AMX) can corrupt the Go heap (golang/go#81238). The runner pool
      # mixes hosts, so a runtime crash is only attributable with the CPU on record.
      - name: runner CPU
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name

      # The coverage job folded in here: the Ubuntu leg produces the
      # coverage-report artifact instead of rerunning the whole suite on a
      # second runner.
      - name: test (coverage)
        if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test -coverprofile="$RUNNER_TEMP/coverage.out" -covermode=atomic ./...

      - name: test
        if: env.RUN_STEPS == 'true' && runner.os == 'macOS'
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test ./...

      - name: upload coverage
        if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage.out
          retention-days: 7

      # Pull requests run the whole Windows suite through one manifest:
      # scripts/ci-windows-targeted.mjs runs the smoke list whole, every other
      # targeted topic under its own -run pattern, with each package running
      # exactly once, and verifies over the combined JSONL that every topic's
      # required tests passed and none of them skipped. The full ./... sweep
      # stays on pushes (test-windows-shards below); the Unix legs always run
      # the full suite. Keep the step budget above the sum of the command
      # budgets; each package test binary remains independently bounded by
      # Go's per-package timeout below.
      #
      # The per-package timeout is 18m: internal/assembly/boot took 478-717s
      # (12 push runs) on the Windows runner, so 18m is 1.5x the worst. A hang
      # still trips the step budget (60m).
      #
      # Every root-module `go test` that runs on Windows passes -count=1. With
      # the result cache on, go test records each file and environment access
      # a test binary makes, and before and after the run resolves every
      # recorded path outside the module through filepath.EvalSymlinks.
      # internal/assembly/boot records about 1.9M accesses; on a Windows runner
      # that bookkeeping costs minutes per pass while nothing is printed.
      # internal/base/testenv holds every such step to it.
      - name: test (Windows PR suite)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 60
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
          WINDOWS_SANDBOX_WAIT_MS: "20000"
        shell: bash
        run: node scripts/ci-windows-targeted.mjs --jsonl "$RUNNER_TEMP/windows-targeted.jsonl"

      - name: test (Windows published command job owner)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/published-job-owner"
          mkdir -p "$evidence"
          go test -count=1 -timeout=3m -json -run '^TestPublishedJob' ./internal/base/proc | tee "$evidence/positive.jsonl"
          node scripts/published-job-evidence.mjs positive "$evidence/positive.jsonl"
          node scripts/published-job-evidence.mjs overlay "$evidence"
          set +e
          go test -count=1 -timeout=3m -json -overlay="$evidence/overlay.json" -run '^TestPublishedJob' ./internal/base/proc > "$evidence/negative.jsonl"
          old_result=$?
          set -e
          test "$old_result" -eq 1
          node scripts/published-job-evidence.mjs negative "$evidence/negative.jsonl"

      - name: upload Windows PR test evidence
        if: always() && env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-pr-test-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-targeted.jsonl
            ${{ runner.temp }}/published-job-owner/
          if-no-files-found: error
          retention-days: 7

  race:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and verify Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true || \
            echo "::warning::bubblewrap is installed but this runner denies user namespaces; unavailable-backend tests will run fail-closed"

      # The matrix never runs -race (it needs cgo); the project's concurrency
      # (plugin fan-out, background phase B, jobs Kill/Wait) would otherwise
      # ship without race coverage. Pull requests sweep only the
      # concurrency-heavy packages so this required check stays fast; pushes
      # to main-v2 keep the full ./... sweep as the safety net.
      - name: test -race (concurrency packages)
        if: github.event_name == 'pull_request'
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test -race ./internal/runtime/agent/... ./internal/runtime/delegation/... ./internal/platform/worktree/... ./internal/state/mutation/... ./internal/ext/plugin/... ./internal/tools/jobs/... ./internal/base/proc/... ./internal/safety/sandbox/... ./internal/base/filelock/... ./internal/contract/eventwire/... ./internal/platform/remote/... ./internal/ext/extension/... ./internal/assembly/boot/... ./internal/session/control/... ./internal/contract/tool/...

  # Push-only full suites. internal/frontend/serve and internal/assembly/boot run
  # hundreds of serial tests and set the wall time of one whole-tree `go test`,
  # so each is cut by test name into shards that run on their own runners. The
  # -run / -skip patterns partition the names exactly: every test lands in one
  # shard. `rest` is every other package. Pull requests keep the focused steps
  # in the `test` and `race` jobs above.
  test-windows-shards:
    if: github.event_name != 'pull_request'
    name: test (windows-latest, ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: rest }
          - { shard: serve-1, pkg: ./internal/frontend/serve, flag: -run, filter: '^Test[A-E]' }
          - { shard: serve-2, pkg: ./internal/frontend/serve, flag: -run, filter: '^Test[F-R]' }
          - { shard: serve-3, pkg: ./internal/frontend/serve, flag: -skip, filter: '^Test[A-R]' }
          - { shard: boot-1, pkg: ./internal/assembly/boot, flag: -skip, filter: '^TestEffect([^0-9A-C]|$)' }
          - { shard: boot-2, pkg: ./internal/assembly/boot, flag: -run, filter: '^TestEffect[D-O]' }
          - { shard: boot-3, pkg: ./internal/assembly/boot, flag: -run, filter: '^TestEffect([^0-9A-O]|$)' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: test (shard)
        timeout-minutes: 40
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
          # Bound sandbox helper children in Windows tests so a failed OS-level
          # launch cannot pin the Actions step after Go's package timeout fires.
          WINDOWS_SANDBOX_WAIT_MS: "20000"
          SHARD: ${{ matrix.shard }}
          PKG: ${{ matrix.pkg }}
          FLAG: ${{ matrix.flag }}
          FILTER: ${{ matrix.filter }}
        shell: bash
        run: |
          if [ "$SHARD" = rest ]; then
            mapfile -t pkgs < <(go list ./... | tr -d '\r' | grep -v -E '/internal/(frontend/serve|assembly/boot)$')
          else
            pkgs=("$PKG")
          fi
          filter=()
          if [ -n "$FILTER" ]; then filter=("$FLAG" "$FILTER"); fi
          go test -count=1 -p 4 -timeout=36m -json "${filter[@]}" "${pkgs[@]}" | tee "$RUNNER_TEMP/shard.jsonl" |
            jq -rj --unbuffered 'select(.Action == "output" and .Test == null) | .Output'

      - name: test (shard) failure detail
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/shard.jsonl"
          [ -s "$f" ] || exit 0
          echo "::group::output of failed tests"
          jq -rn '[inputs | select(.Test != null)] | group_by(.Package + "/" + .Test)
            | map(select(any(.[]; .Action == "fail")))[]
            | map(select(.Action == "output") | .Output) | join("")' "$f" || true
          echo "::endgroup::"
          echo "slowest tests (seconds, package, name):"
          jq -rn '[inputs | select(.Test != null and .Action == "pass")]
            | sort_by(-.Elapsed)[:15][] | "\(.Elapsed)	\(.Package)	\(.Test)"' "$f" || true

  race-shards:
    if: github.event_name != 'pull_request'
    name: race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: rest }
          - { shard: serve-1, pkg: ./internal/frontend/serve, flag: -run, filter: '^Test[A-E]' }
          - { shard: serve-2, pkg: ./internal/frontend/serve, flag: -run, filter: '^Test[F-R]' }
          - { shard: serve-3, pkg: ./internal/frontend/serve, flag: -skip, filter: '^Test[A-R]' }
          - { shard: boot-1, pkg: ./internal/assembly/boot, flag: -skip, filter: '^TestEffect([^0-9A-C]|$)' }
          - { shard: boot-2, pkg: ./internal/assembly/boot, flag: -run, filter: '^TestEffect[D-O]' }
          - { shard: boot-3, pkg: ./internal/assembly/boot, flag: -run, filter: '^TestEffect([^0-9A-O]|$)' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and verify Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true ||             echo "::warning::bubblewrap is installed but this runner denies user namespaces; unavailable-backend tests will run fail-closed"

      - name: test -race (shard)
        timeout-minutes: 30
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
          SHARD: ${{ matrix.shard }}
          PKG: ${{ matrix.pkg }}
          FLAG: ${{ matrix.flag }}
          FILTER: ${{ matrix.filter }}
        run: |
          if [ "$SHARD" = rest ]; then
            mapfile -t pkgs < <(go list ./... | grep -v -E '/internal/(frontend/serve|assembly/boot)$')
          else
            pkgs=("$PKG")
          fi
          filter=()
          if [ -n "$FILTER" ]; then filter=("$FLAG" "$FILTER"); fi
          go test -race -timeout=25m "${filter[@]}" "${pkgs[@]}"

  # sdk/go is a nested stdlib-only module invisible to root `go test ./...`.
  # Its DTOs are generated from internal/ext/extension/protocol, and the
  # host-side conformance tests spawn the SDK example, so the job runs the
  # same three-OS matrix as the root tests.
  sdk:
    needs: changes
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ github.event_name == 'pull_request' && needs.changes.outputs.platform == 'false' && 'ubuntu-latest' || matrix.os }}
    env:
      RUN_STEPS: ${{ github.event_name != 'pull_request' || (needs.changes.outputs.sdk != 'false' && (matrix.os == 'ubuntu-latest' || needs.changes.outputs.platform != 'false')) }}
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod

      - name: gofmt
        if: env.RUN_STEPS == 'true'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        if: env.RUN_STEPS == 'true'
        run: go vet ./...

      - name: stdlib-only guard
        if: env.RUN_STEPS == 'true'
        shell: bash
        run: |
          # The SDK is a public module with a hard stdlib-only contract.
          if go list -m all | grep -v '^github.com/esengine/DeepSeek-Reasonix/sdk/go$'; then
            echo "sdk/go must not depend on anything outside the standard library"
            exit 1
          fi

      - name: test
        if: env.RUN_STEPS == 'true'
        run: go test ./...

      - name: test -race
        if: github.event_name != 'pull_request' && env.RUN_STEPS == 'true'
        run: go test -race ./...

  # desktop/ is a separate module, so the root matrix above does not compile
  # it against a real macOS toolchain; this one does. Linux owns the static
  # gates, macOS the cgo watchdog under -race and lint, Windows the update
  # helper's versioned-install and uninstall paths (//go:build windows).
  desktop:
    needs: changes
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    # A pull request with no platform-relevant change moves the macOS and
    # Windows legs onto an ubuntu runner with every step skipped, like the
    # test job above: the check names the ruleset requires still report,
    # without a scarce runner.
    runs-on: ${{ github.event_name == 'pull_request' && needs.changes.outputs.platform == 'false' && 'ubuntu-latest' || matrix.os }}
    env:
      RUN_STEPS: ${{ github.event_name != 'pull_request' || (needs.changes.outputs.desktop != 'false' && (matrix.os == 'ubuntu-22.04' || needs.changes.outputs.platform != 'false')) }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: gofmt
        if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod tidy
        if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "desktop/go.mod or go.sum is stale - run 'cd desktop && go mod tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: vet
        if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        run: go vet ./...

      - name: golangci-lint
        if: env.RUN_STEPS == 'true' && runner.os != 'Windows'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: desktop
          args: --timeout=5m

      - name: build
        if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        run: go build ./...

      # The update helper replaces a running application under pkexec, so its
      # own concurrency is CI-blocked rather than author-verified locally.
      - name: test -race
        if: env.RUN_STEPS == 'true' && runner.os != 'Windows'
        run: go test -race ./...

      - name: test (update helper and uninstaller)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        timeout-minutes: 15
        run: go test ./...

  # repolint scans desktop/ and sdk/ too, so this job also runs for diffs the
  # `code` filter would otherwise skip.
  lint:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.code != 'false' || needs.changes.outputs.desktop != 'false' || needs.changes.outputs.sdk != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: repo standards
        run: go run ./tools/repolint

      # The paths the project declared sensitive, held to the coverage they
      # already have. It runs only those packages' tests, not the full suite.
      - name: sensitive-path coverage
        run: go run ./tools/covergate

      # `make lint-install` reads the same file, so a local run and this job
      # cannot drift onto different linter versions.
      - id: golangci
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --timeout=5m

      # The step above only type-checks the linux/amd64 build, so every
      # //go:build windows and //go:build darwin file in the tree went unlinted.
      # Both modules cross-check without a toolchain; desktop under darwin does
      # not, because its watchdog is cgo, so that leg lives in the desktop
      # matrix's macOS leg.
      - name: golangci-lint (cross-platform build tags)
        run: |
          set -euo pipefail
          command -v golangci-lint
          for target in "darwin ." "windows ." "windows desktop"; do
            read -r target_os target_dir <<< "$target"
            echo "::group::golangci-lint GOOS=$target_os ($target_dir)"
            (cd "$target_dir" && GOOS="$target_os" golangci-lint run --timeout=5m ./...)
            echo "::endgroup::"
          done

      # Workflow contracts: every workflow this branch restructured or that
      # reaches release/signing machinery. actionlint parses the expressions
      # and job graphs the YAML schema cannot see.
      - name: release workflow contracts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -ignore 'label "windows-11-arm" is unknown' \
            -ignore 'label "ubuntu-22.04-arm" is unknown' \
            .github/workflows/release-studio.yml \
            .github/workflows/studio-certum-signing-smoke.yml \
            .github/workflows/studio.yml \
            .github/workflows/studio-tauri.yml \
            .github/workflows/ci.yml \
            .github/workflows/pr-gate-and-labels.yml \
            .github/workflows/issue-labels.yml

  govulncheck:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-latest
    continue-on-error: true # informational — stdlib vulns need a Go patch release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...
