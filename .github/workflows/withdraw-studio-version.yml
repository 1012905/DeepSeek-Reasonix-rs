name: Withdraw a Studio version

# Pulls a published Studio release out of the update catalog (or puts it back),
# so installs stop being offered it without waiting for a new release. Only the
# catalog changes: the release's files stay where they are, and a withdrawn
# release can be restored with the same run. The catalog is the versions.json
# asset of the latest release, so a withdrawal that demotes the latest slot
# hands the catalog to the release that takes it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to withdraw or restore, for example 0.1.0"
        required: true
        type: string
      reason:
        description: "Why it is withdrawn (shown to users on that version); ignored when restoring"
        required: false
        type: string
      restore:
        description: "Put a withdrawn version back instead of withdrawing it"
        required: false
        type: boolean
        default: false

concurrency:
  group: studio-catalog
  cancel-in-progress: false

jobs:
  withdraw:
    name: ${{ inputs.restore && 'restore' || 'withdraw' }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: studio-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: studio
          persist-credentials: false

      - name: Update the Studio catalog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
          RESTORE: ${{ inputs.restore }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like 0.1.0"
            exit 1
          fi
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          work="$(mktemp -d)"
          holder="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release download "$holder" --repo "$GITHUB_REPOSITORY" --pattern versions.json --dir "$work"
          current="$work/versions.json"
          mkdir -p "$work/next"
          next="$work/next/versions.json"
          if [ "$RESTORE" = "true" ]; then
            bash scripts/withdraw-version.sh "$current" --restore "$VERSION" "$at" > "$next"
            jq -e --arg v "$VERSION" '.versions | map(select((.version | ltrimstr("v")) == $v)) | length == 1' "$next" >/dev/null
            gh release upload "$holder" "$next" --clobber --repo "$GITHUB_REPOSITORY"
          else
            bash scripts/withdraw-version.sh "$current" "$VERSION" "$REASON" "$at" > "$next"
            jq -e --arg v "$VERSION" '(.versions | map(select((.version | ltrimstr("v")) == $v)) | length == 0) and (.withdrawn | map(select((.version | ltrimstr("v")) == $v)) | length == 1)' "$next" >/dev/null
            # Demote before resolving the upload target: withdrawing the release
            # that holds the latest slot moves the catalog to its successor.
            gh release edit "studio-v${VERSION}" --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
            target="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
            if [ -z "$target" ]; then
              echo "::error::no stable release remains to carry the catalog"
              exit 1
            fi
            gh release upload "$target" "$next" --clobber --repo "$GITHUB_REPOSITORY"
          fi
          echo "Studio catalog updated for $VERSION (restore=$RESTORE)"