name: Release Studio (Tauri)
run-name: Release Studio ${{ github.ref_name }}

# Studio's release line: a studio-v* tag builds the Tauri shell around the Go
# host on each platform, minisign-signs every artifact with the key whose public
# half is compiled into the client (update.PublicKey), and publishes the
# rollback catalog as the latest release's versions.json asset. Check-only:
# nothing here enables automatic installation.
on:
  push:
    tags: ['studio-v*']

permissions:
  contents: read

# The catalog is one asset on one release; a publish and a withdraw must never
# merge against each other's read.
concurrency:
  group: studio-catalog
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: resolve Studio release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      candidate: ${{ steps.release.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag and version
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ ^studio-v(.+)$ ]] || [[ ! "${BASH_REMATCH[1]}" =~ $semver ]]; then
            echo "::error::studio release tag must be studio-vMAJOR.MINOR.PATCH[-PRERELEASE], got: $tag"
            exit 1
          fi
          version="${tag#studio-}"
          # Semver's prerelease segment, group 4, read from the grammar rather
          # than the spelling.
          candidate=false
          if [[ "${version#v}" =~ $semver ]] && [ -n "${BASH_REMATCH[4]}" ]; then
            candidate=true
          fi
          { echo "tag=$tag"; echo "version=$version"; echo "sha=$SHA"
            echo "candidate=$candidate"; } >> "$GITHUB_OUTPUT"
          echo "resolved $tag -> $version at $SHA (candidate=$candidate)"

      - name: Require versioned release notes
        env:
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          notes="release-notes/studio/${VERSION#v}.md"
          if ! git cat-file -e "$SHA:$notes"; then
            echo "::error::$notes must exist in the tagged commit before a Studio release can build"
            exit 1
          fi

  build:
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
            runner: macos-latest
            bundles: app,dmg
            artifact: studio-build-darwin-arm64
          - platform: windows
            arch: amd64
            runner: windows-latest
            bundles: nsis
            artifact: studio-build-windows-amd64
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
            bundles: deb,rpm,appimage
            artifact: studio-build-linux-amd64
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop-tauri/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Tauri's Linux sys-crates compile pkg-config build scripts that fail
      # without the system libraries; rpm builds the .rpm spec.
      - name: Install Tauri Linux prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev rpm file

      - name: Install frontend dependencies
        run: pnpm -C desktop-tauri install --frozen-lockfile

      # beforeBuildCommand builds the Go host into src-tauri/bin and the page
      # into desktop-tauri/dist; bundle.resources lifts both into the package
      # where src-tauri/src/layout.rs reads them.
      - name: Build the Tauri bundles
        run: pnpm -C desktop-tauri tauri build --bundles ${{ matrix.bundles }}

      # studio-manifest resolves artifacts by the ReasonixStudio-<os>-<arch>
      # naming rule, so each bundle is collected under the name the updater
      # reads; the macOS zip carries the .app the bundle swap extracts.
      - name: Collect artifacts
        run: |
          set -euo pipefail
          bundle="desktop-tauri/src-tauri/target/release/bundle"
          mkdir -p dist
          case "$PLATFORM" in
            darwin)
              cp "$bundle"/dmg/*.dmg "dist/ReasonixStudio-darwin-$ARCH.dmg"
              ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Reasonix Studio.app" "dist/ReasonixStudio-darwin-$ARCH.zip"
              ;;
            windows)
              cp "$bundle"/nsis/*-setup.exe "dist/ReasonixStudio-windows-$ARCH-installer.exe"
              ;;
            linux)
              cp "$bundle"/deb/*.deb "dist/ReasonixStudio-linux-$ARCH.deb"
              cp "$bundle"/rpm/*.rpm "dist/ReasonixStudio-linux-$ARCH.rpm"
              cp "$bundle"/appimage/*.AppImage "dist/ReasonixStudio-linux-$ARCH.AppImage"
              ;;
          esac
          for f in dist/*; do
            test -s "$f" || { echo "::error::$f is missing or empty" >&2; exit 1; }
          done
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  publish:
    name: sign, publish and update the catalog
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Owner approval for the whole line, given with the artifacts already
    # proven to build.
    environment: studio-release
    permissions:
      contents: write
      issues: read # release-notes credits read PR and issue authors
      pull-requests: read
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      CANDIDATE: ${{ needs.resolve.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Every package by its exact artifact name, never a pattern: any job
      # without secrets can upload an artifact, and a pattern would publish it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-build-darwin-arm64
          path: staging/studio-build-darwin-arm64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-build-windows-amd64
          path: staging/studio-build-windows-amd64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-build-linux-amd64
          path: staging/studio-build-linux-amd64

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # Two artifacts carrying one file name fail the release rather than
          # letting move order pick.
          while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            if [ -e "dist/$name" ]; then
              echo "::error::$name arrived in more than one artifact"
              exit 1
            fi
            mv "$f" "dist/$name"
          done < <(find staging -type f -name 'ReasonixStudio-*' -print0)
          ls -la dist

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      # The same minisign key the retired desktop line used, because the public
      # key that verifies it is compiled into the client (update.PublicKey).
      # The key material only ever reaches a 0600 temp file and stdin.
      - name: Sign and verify every artifact
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$MINISIGN_PRIVATE_KEY" > "$keyfile"
          pubkey='RWR/pYzg75IeRJDyhHJGLGwvQIXX/EbSusBykGrtLdLYSBL7SSzwCxPG'
          for f in dist/ReasonixStudio-*; do
            case "$f" in *.minisig) continue ;; esac
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -q -s "$keyfile" -m "$f" -x "$f.minisig"
            minisign -V -q -P "$pubkey" -m "$f" -x "$f.minisig"
          done

      - name: Render version notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/studio-release-notes.mjs "release-notes/studio/${VERSION#v}.md" "$RUNNER_TEMP/version-notes.md"

      - name: Generate manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: go run ./cmd/studio-manifest dist "$VERSION" "$TAG"

      - name: Publish the GitHub release and the catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/version-notes.md" dist/notes.md
          # The catalog holder is resolved before this release can take the
          # latest slot, so the merge reads the catalog that is published now.
          holder="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          work="$(mktemp -d)"
          source=-
          if [ -n "$holder" ]; then
            if gh release download "$holder" --repo "$GITHUB_REPOSITORY" --pattern versions.json --dir "$work" 2>/dev/null; then
              source="$work/versions.json"
            fi
          fi
          decided="$(git tag -l 'studio-v*' | bash scripts/studio-release-flags.sh "$TAG" "$CANDIDATE")"
          mapfile -t flags <<<"$decided"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/notes.md "${flags[@]}"
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Reasonix Studio $VERSION" --notes-file dist/notes.md "${flags[@]}"
          fi
          # A candidate is published so it can be installed from its own
          # manifest and tested, but it never enters the catalog.
          if [ "$CANDIDATE" = "true" ]; then
            echo "$TAG published as a prerelease; the catalog stays at its released version"
            exit 0
          fi
          mkdir -p "$work/next"
          notes_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/notes.md"
          bash scripts/update-versions-index.sh "$source" "$VERSION" "$TAG" studio \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 20 "$notes_url" > "$work/next/versions.json"
          jq -e --arg v "$VERSION" '.versions | map(select(.version == $v)) | length == 1' "$work/next/versions.json" >/dev/null
          # The catalog rides on whichever release holds the latest slot after
          # this publication: recovering an older tag must not move it.
          target="$holder"
          for flag in "${flags[@]}"; do
            if [ "$flag" = "--latest" ]; then target="$TAG"; fi
          done
          if [ -z "$target" ]; then
            echo "::error::no release holds the latest slot, so the catalog has nowhere to live"
            exit 1
          fi
          gh release upload "$target" "$work/next/versions.json" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Studio catalog -> $VERSION on $target"