name: PR gate and labels

# One pull_request_target workflow for the three things a PR needs when it
# opens or changes: the author gate, its area labels, and its version label.
# All three run in the base repository's context and never execute
# pull-request code — the gate checks out the base branch only (the allowlist
# it reads is the base branch's), actions/labeler reads the diff file list
# without checking anything out, and the version label reads only the base
# ref.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Pull requests are limited to maintainers and the logins in
  # .github/pr-authors.txt. A closing decision must not be cancelled mid-run,
  # so this job alone keeps cancel-in-progress off.
  gate:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-author-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node scripts/pr-author-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  # Area labels from the changed paths (see .github/labeler.yml). Kept in sync
  # with the issue area labels, which the AI-based issue labeler applies.
  area-label:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-autolabel-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          sync-labels: false

  # Contributors (especially from forks) can't set labels themselves — that
  # needs triage rights. A PR's version line is fully determined by its base
  # branch, so this reads base.ref and applies v1/v2/v3 on their behalf, the
  # same three lines the issue forms label.
  version-label:
    if: github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-version-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const LINE_OF = { v1: 'v1', studio: 'v3' };
            const base = context.payload.pull_request.base.ref;
            const label = LINE_OF[base];
            if (!label) {
              core.info(`Base branch '${base}' isn't a release line; skipping.`);
              return;
            }
            const others = Object.values(LINE_OF).filter((line) => line !== label);
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
            // Drop the other lines' labels if the base was changed after opening.
            for (const other of others) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: context.payload.pull_request.number,
                  name: other,
                });
              } catch (e) {
                core.info(`No ${other} label to remove.`);
              }
            }
