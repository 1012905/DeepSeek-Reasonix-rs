name: Deploy forum worker

# The Cloudflare credentials this job needs are not configured in this
# repository, so the automatic trigger stays off: a push-triggered deploy
# would fail on the missing secret. Set CLOUDFLARE_API_TOKEN, then restore
# the push trigger below:
#   push:
#     branches: [studio]
#     paths: ['workers/forum/**', '.github/workflows/deploy-forum-worker.yml']
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-forum-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: workers/forum/pnpm-lock.yaml
      - name: Deploy
        working-directory: workers/forum
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          npx wrangler deploy
