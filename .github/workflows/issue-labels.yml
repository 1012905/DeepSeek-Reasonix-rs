name: Label issues

# One issues workflow for the two labelers: the AI-based area/platform/
# severity classification and the version line the report forms carry. Both
# run on the issue body and metadata only.
on:
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write

jobs:
  # Classify new issues into area / platform / severity labels using the
  # DeepSeek API (the project's own model). The model is constrained to a
  # fixed label set — anything it returns outside the set is dropped — so it
  # can't invent labels. Issues it can't place into any area get
  # `needs-triage` for a human to look at. An edited issue only re-answers the
  # version line, so this job stands down on edited.
  classify:
    if: github.event.action == 'opened' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    concurrency:
      group: issue-autolabel-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          script: |
            const AREA = ['agent','mcp','config','updater','provider','desktop','tui','skills','rendering'];
            const PLATFORM = ['windows','macos','linux'];
            const SEVERITY = ['crash','data-loss','security'];
            const ALLOWED = new Set([...AREA, ...PLATFORM, ...SEVERITY]);

            const issue = context.payload.issue;
            const title = issue.title || '';
            const body = (issue.body || '').slice(0, 4000);

            const system = [
              'You categorize GitHub issues for Reasonix, a Go-based AI coding agent with an Electron desktop app and a terminal UI.',
              'Pick labels ONLY from these fixed sets. Never invent labels.',
              'area (0-2, the affected subsystem):',
              '  agent: core agent loop / tool-calling / reasoning',
              '  mcp: MCP servers, plugins, codegraph',
              '  config: configuration, setup wizard, .toml/.env',
              '  updater: auto-update, installer, release packaging',
              '  provider: model providers, model selection/switching',
              '  desktop: Electron desktop GUI',
              '  tui: terminal UI / CLI',
              '  skills: skills system',
              '  rendering: terminal rendering / flicker / repaint',
              'platform (only if clearly specific to one OS): windows, macos, linux',
              'severity (only if clearly applicable):',
              '  crash: app crashes, hangs, or freezes',
              '  data-loss: loss of sessions, config, or history',
              '  security: credential/secret exposure or a security flaw',
              'Be conservative: omit a label when unsure. The issue may be in Chinese.',
              'Reply with JSON only: {"area":[],"platform":[],"severity":[]}',
            ].join('\n');

            let labels = [];
            try {
              const res = await fetch('https://api.deepseek.com/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.DEEPSEEK_API_KEY}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  model: 'deepseek-chat',
                  temperature: 0,
                  response_format: { type: 'json_object' },
                  messages: [
                    { role: 'system', content: system },
                    { role: 'user', content: `Title: ${title}\n\nBody:\n${body}` },
                  ],
                }),
              });
              if (!res.ok) {
                core.warning(`DeepSeek API ${res.status}: ${await res.text()}`);
                return;
              }
              const data = await res.json();
              const parsed = JSON.parse(data.choices[0].message.content);
              labels = [...(parsed.area || []), ...(parsed.platform || []), ...(parsed.severity || [])]
                .filter(l => ALLOWED.has(l));
            } catch (e) {
              core.warning(`Classification failed: ${e.message}`);
              return;
            }

            if (!labels.some(l => AREA.includes(l))) labels.push('needs-triage');

            if (labels.length) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels,
              });
              core.info(`Applied: ${labels.join(', ')}`);
            }

  # Issue forms can't let a reporter set a label directly (that needs triage
  # rights), so the bug/feature forms carry a "Version line" dropdown and this
  # job reads the submitted value and applies the matching label on their
  # behalf: 0.x -> v1 (TypeScript), 2.x -> v3 (studio).
  version-label:
    if: github.event.action == 'opened' || github.event.action == 'edited'
    runs-on: ubuntu-latest
    concurrency:
      group: issue-version-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const body = context.payload.issue.body || '';
            const sectionOf = (name) =>
              body.split(/^###\s+/m).find((s) => new RegExp(`^${name}`, 'i').test(s)) || '';
            const labelOf = (major) => ({ 0: 'v1', 1: 'v2', 2: 'v3' })[major];

            const m = sectionOf('Version line').match(/\b([012])\.x\b/);
            if (!m) {
              core.info('No version line found; nothing to label.');
              return;
            }
            let choice = labelOf(Number(m[1]));

            // The dropdown is a choice, and its first entry gets picked by
            // reporters who never looked. `Exact version` is pasted from
            // `reasonix --version` or Studio, so when it parses it is the better
            // evidence. Anything that does not parse (a commit sha, a branch
            // name) or names no known line leaves the dropdown to decide.
            const exact = sectionOf('Exact version').match(/\b(\d+)\.(\d+)\.(\d+)/);
            const fromVersion = exact && labelOf(Number(exact[1]));
            if (fromVersion && fromVersion !== choice) {
              core.info(`Version line says ${choice} but ${exact[0]} says ${fromVersion}; trusting the version.`);
              choice = fromVersion;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: [choice],
            });
            // Keep the line labels mutually exclusive in case an edit flipped the choice.
            for (const other of ['v1', 'v2', 'v3'].filter((l) => l !== choice)) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: context.issue.number,
                  name: other,
                });
              } catch (e) {
                core.info(`No ${other} label to remove.`);
              }
            }
