name: CodeQL

on:
  # Docs/release-notes/root-Markdown changes carry no analyzable code; the
  # weekly cron keeps the full scan cadence regardless.
  push:
    branches: [studio]
    paths-ignore:
      - 'docs/**'
      - 'release-notes/**'
      - '*.md'
  pull_request:
    branches: [studio]
    paths-ignore:
      - 'docs/**'
      - 'release-notes/**'
      - '*.md'
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
