# Area labels auto-applied to PRs by .github/workflows/pr-gate-and-labels.yml
# (actions/labeler), based on the changed file paths. Keep the area set in sync
# with issue-labels.yml. severity/platform are issue-only — a PR is a change,
# not a bug report — and v1/v2/v3 are handled by the version-label jobs.

agent:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/runtime/agent/**'
          - 'internal/session/control/**'

mcp:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/ext/plugin/**'
          - 'internal/codegraph/**'

config:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/contract/config/**'
          - 'internal/assembly/boot/**'

provider:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/contract/provider/**'

skills:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/ext/skill/**'
          - 'internal/contract/tool/**'

tui:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/frontend/cli/**'

desktop:
  - changed-files:
      - any-glob-to-any-file:
          - 'desktop/**'

updater:
  - changed-files:
      - any-glob-to-any-file:
          - 'desktop/cmd/sign/**'
          - 'desktop/updater*.go'
          - 'scripts/desktop-build.sh'
          - '.github/workflows/release*.yml'
