# cargo-deny configuration (AGENTS.md 8.6: `cargo deny check`).
# The graph covers all six release targets so target-specific dependencies
# are held to the same license and source policy.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-musl" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
]
all-features = true

[licenses]
version = 2
# Allow-list per AGENTS.md 10.6: MIT / Apache-2.0 first, plus the common
# permissive licenses pulled in by rustls/tokio ecosystem crates.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "deny"
# chrono is flagged unmaintained (RUSTSEC-2026-0543, no fixed upgrade
# available). Kept deliberately: the state crate's timestamp model
# (CreatedAt, DateTime<FixedOffset>) is built on it, and cargo audit
# already treats the advisory as an allowed warning. Revisit alongside
# a jiff/time migration.
ignore = ["RUSTSEC-2026-0543"]
