# Reasonix Rust kernel — Cargo workspace.
#
# Layout and dependency direction are frozen in docs/kernel-rs/AGENTS.md 4.2
# and docs/adr/0001. The two shippable binaries live in apps/; everything
# under crates/ is a library; xtask carries repository automation. The
# contract inventory is frozen (docs/contracts), so product dependencies
# enter the workspace under the supply-chain policy in deny.toml.
[workspace]
resolver = "3"
members = [
    "apps/reasonix",
    "apps/reasonix-studio-host",
    "crates/acp",
    "crates/agent",
    "crates/assembly",
    "crates/cli",
    "crates/config",
    "crates/contract",
    "crates/core",
    "crates/ext",
    "crates/platform",
    "crates/provider",
    "crates/safety",
    "crates/serve",
    "crates/session",
    "crates/state",
    "crates/testkit",
    "crates/tools",
    "crates/tui",
    "xtask",
]
# The Tauri shell is its own workspace: a different toolchain profile and a
# dependency graph that must not enter the kernel's Cargo.lock.
exclude = ["desktop-tauri/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
# Internal crate graph (AGENTS.md 4.2). Members consume these via
# `name.workspace = true` so every edge is declared in exactly one place.
# Versions must track workspace.package.version: path-only entries read as
# wildcard versions and fail the cargo-deny wildcard ban.
reasonix-acp = { path = "crates/acp", version = "0.3.0" }
reasonix-agent = { path = "crates/agent", version = "0.3.0" }
reasonix-assembly = { path = "crates/assembly", version = "0.3.0" }
reasonix-cli = { path = "crates/cli", version = "0.3.0" }
reasonix-config = { path = "crates/config", version = "0.3.0" }
reasonix-contract = { path = "crates/contract", version = "0.3.0" }
reasonix-core = { path = "crates/core", version = "0.3.0" }
reasonix-ext = { path = "crates/ext", version = "0.3.0" }
reasonix-platform = { path = "crates/platform", version = "0.3.0" }
reasonix-provider = { path = "crates/provider", version = "0.3.0" }
reasonix-safety = { path = "crates/safety", version = "0.3.0" }
reasonix-serve = { path = "crates/serve", version = "0.3.0" }
reasonix-session = { path = "crates/session", version = "0.3.0" }
reasonix-state = { path = "crates/state", version = "0.3.0" }
reasonix-testkit = { path = "crates/testkit", version = "0.3.0" }
reasonix-tools = { path = "crates/tools", version = "0.3.0" }
reasonix-tui = { path = "crates/tui", version = "0.3.0" }

# External dependencies (AGENTS.md 10.6). The contract inventory is frozen
# (docs/contracts/*.md), so product dependencies now enter the workspace.
# Each must stay pure Rust with a permissive license and be justified by
# the crate that pulls it in.
caseless = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
fs4 = "0.13"
getrandom = "0.3"
hostname = "0.4"
regex = "1"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
base64 = "0.22"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
# serve password mode (docs/contracts/http.md §2.3): bcrypt cost 12 and the
# HMAC-SHA256 session signature. hmac shares digest 0.10 with sha2; bcrypt 0.17
# is the last line on getrandom 0.3, the workspace pin.
bcrypt = "0.17"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
# Test-only: temporary directories for state/contract integration tests
tempfile = "3"
thiserror = "2"
tracing = "0.1"
unicode-general-category = "0.6"
unicode-normalization = "0.1"

# Async/HTTP stack (serve slice, M4): runtime, router, SSE framing, config
# parse. Chosen in docs/tech-choice.md; the supply-chain policy in deny.toml
# holds for every entry.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "signal", "sync", "time", "fs"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
bytes = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"

# Outbound HTTPS (provider slice, B-007): hyper client + rustls TLS with the
# ring provider (AGENTS.md 3.3: rustls only, pure-Rust crypto) and the
# Mozilla root bundle. No reqwest: the hand-wired connector keeps one HTTP
# stack in the graph (serve already pins hyper/hyper-util). Versions track
# what serve already locked for hyper/hyper-util; the rustls line is new.
http-body = "1.1.0"
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "tokio", "service", "http1", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", default-features = false }
webpki-roots = "1.0.12"

# Dev-only: microbenchmarks for the serve/host hot paths (docs/tech-choice.md).
criterion = "0.5"
